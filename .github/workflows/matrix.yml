name: matrix strategy yml

on:
  push:
    branches: [main]
  #  paths: matrix.yml

jobs:
  matrix-request:    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10','3.11','3.12']
        exclude:
         - os: macos-latest
           python-version: 3.10
    runs-on: ${{ matrix.os }}

    steps:
     - name: install python version
       uses: actions/setup-python@v4
       with:
         python-version: ${{ matrix.python-version }}
     - name: print python version
       run: python --version