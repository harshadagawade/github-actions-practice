name: matrix strategy yml

on:
  push:
    branches : [main]
  #  paths: matrix.yml

jobs:
  matrix:    
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      python-version: ['3.10','3.11','3.12']

  steps:
    - name: install python version
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: print python version
      run: python --version