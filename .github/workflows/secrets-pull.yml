name: Secrets-pull

on:
  workflow_dispatch:

jobs:
  secret1:
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
        
      - name: pull images
        run: docker pull ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master
