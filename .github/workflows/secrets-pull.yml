name: Secrets-pull

on:
  workflow_dispatch:

jobs:
  secret1:
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
        
      - name: pull images
        run: docker pull ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master

      - name: list images from my repo
        run: |
          DATA=$(curl -s -u ${{ vars.DOCKER_USERNAME }}:${{ secrets.DOCKER_TOKEN }} https://hub.docker.com/v2/repositories/${{ vars.DOCKER_USERNAME }}/)
          echo "Repositories:"
          echo "$DATA" | jq -r '.results[].name'
