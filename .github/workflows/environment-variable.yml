name: Environment-variables

on:
  workflow_dispatch:
env: 
  APP_NAME: myapp

jobs:
  test:
    runs-on: ubuntu-latest
    env: 
      ENVIRONMENT: staging
    steps:
     - name: print all variables
       run: |
        echo "$APP_NAME is in $ENVIRONMENT and version is $VERSION"
        echo "actor is" ${{ github.actor }}
        eccho "commit sha: " ${{ github.sha }}
       env:
         VERSION: 1.0.0