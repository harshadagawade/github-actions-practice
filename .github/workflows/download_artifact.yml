name: download artifact

on:
  workflow_dispatch:

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: generate a files
        run: |
           echo "This is a log file generated by the workflow" > log.txt
           echo "Current date and time: $(date)" >> log.txt
           echo "Workflow run ID: $GITHUB_RUN_ID" >> log.txt
           echo "Workflow run number: $GITHUB_RUN_NUMBER" >> log.txt
           echo "Repository: $GITHUB_REPOSITORY" >> log.txt
           echo "Actor: $GITHUB_ACTOR" >> log.txt

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: log.txt
          path: log.txt

  download-artifact:
    needs: upload-artifact
    runs-on: ubuntu-latest
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: log.txt
        

      - name: list artifact
        run: cat log.txt    